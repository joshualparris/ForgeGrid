project: "whispering-wilds"
repository:
  url: "https://github.com/you/whispering-wilds.git"
  base_commit: "0123456789abcdef0123456789abcdef01234567"
  branch: "forgegrid/whispering-wilds-build"
  create_pr: true
  pr_title: "ForgeGrid game export"
  pr_body: "Automated build/export branch generated by ForgeGrid."

tasks:
  test:
    description: Run automated tests
    requirements:
      min_ram_gb: 4
      labels: ["trusted"]
      capabilities: ["godot"]
    execution:
      profile: "GodotExport"
      parameters:
        preset: "Test"
        export_path: "build/test"
      timeout_seconds: 900
      max_retries: 1

  windows-build:
    requirements:
      os: windows
      min_ram_gb: 8
      labels: ["windows-build"]
      capabilities: ["godot"]
    execution:
      profile: "GodotExport"
      parameters:
        preset: "Windows"
        export_path: "build/game.exe"
      timeout_seconds: 1800
      max_retries: 1
    artefacts:
      - build/**

  linux-build:
    requirements:
      os: linux
      min_ram_gb: 8
      labels: ["linux-build"]
      capabilities: ["godot"]
    execution:
      profile: "GodotExport"
      parameters:
        preset: "Linux"
        export_path: "build/game.x86_64"
      timeout_seconds: 1800
      max_retries: 1
    artefacts:
      - build/**

  lint:
    requirements:
      capabilities: ["node"]
    execution:
      profile: "NodeLint"
      timeout_seconds: 600
      max_retries: 1
