project: "AdventureText"
repository:
  url: "https://github.com/joshparri/AdventureText.git"
  base_commit: "f2579801f2500a2d7b4cf9b4f6090b2d3eb956ae"
  branch: "forgegrid/add-small-feature"
  create_pr: false
tasks:
  ai-add-feature:
    requirements:
      os: "windows"
      capabilities: ["ai-agent", "git"]
    execution:
      profile: "ai"
      parameters:
        prompt: "Add a small useful feature to AdventureText (like a new room or a simple action command), include/update tests, run the test suite, and ensure it passes."
      timeout_seconds: 3600
      max_retries: 1
      changes:
        commit: true
        push: false
        commit_message: "feat: add small useful feature via AIAgent"
