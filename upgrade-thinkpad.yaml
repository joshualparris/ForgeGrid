project: "ForgeGridUpgrade"
repository:
  url: "https://github.com/joshparri/ForgeGrid.git"
  base_commit: "HEAD"
  branch: "main"
tasks:
  upgrade-worker:
    requirements:
      os: "windows"
      labels: ["thinkpad-lenovo"]
    execution:
      profile: "AIAgent"
      parameters:
        task: "Download the updated ForgeGrid binary from http://10.245.173.178:8000/ForgeGrid.exe and replace C:\\dev\\6 Laptops\\ForgeGrid\\Windows\\ForgeGrid.exe. First download it to a temp file, then stop the ForgeGrid process, replace the executable, and start the new process. Or use whatever path ForgeGrid is currently running from."
      timeout_seconds: 600
